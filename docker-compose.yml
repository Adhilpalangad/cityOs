name: cityos

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cityos}
      POSTGRES_USER: ${POSTGRES_USER:-cityos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cityos_dev_only}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates cityos_identity and cityos_city_core alongside POSTGRES_DB
      # (cityos) -- only runs on first init of an empty data directory, so
      # it won't apply to an existing volume; see README troubleshooting.
      - ./infrastructure/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-cityos_dev_only}
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v25.2.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092", "9644:9644"]
    volumes: ["redpanda_data:/var/lib/redpanda/data"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    # MinIO stopped publishing to Docker Hub (minio/minio, minio/mc both
    # 404 there now) and only publishes to quay.io as of 2025.
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-cityos}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-cityos_dev_only}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-cityos}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-cityos_dev_only}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-cityos-development}
    volumes: ["./infrastructure/minio/create-bucket.sh:/create-bucket.sh:ro"]
    entrypoint: ["/bin/sh", "/create-bucket.sh"]
    restart: "no"

  api:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cityos}:${POSTGRES_PASSWORD:-cityos_dev_only}@postgres:5432/${POSTGRES_DB:-cityos}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-cityos_dev_only}
      QDRANT_URL: http://qdrant:6333
      KAFKA_BROKERS: redpanda:9092
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      IDENTITY_SERVICE_URL: http://identity:8001
      CITY_CORE_SERVICE_URL: http://city-core:8002
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      identity: { condition: service_started }
      city-core: { condition: service_started }

  identity:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cityos}:${POSTGRES_PASSWORD:-cityos_dev_only}@postgres:5432/cityos_identity
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-http://localhost:8000}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
    ports: ["${IDENTITY_PORT:-8001}:8001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  city-core:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: services/city-core/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cityos}:${POSTGRES_PASSWORD:-cityos_dev_only}@postgres:5432/cityos_city_core
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      KAFKA_BROKERS: redpanda:9092
    ports: ["${CITY_CORE_PORT:-8002}:8002"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }

  traffic-provider:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: data-providers/traffic/Dockerfile
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["${TRAFFIC_PROVIDER_PORT:-8010}:8010"]
    depends_on:
      redpanda: { condition: service_healthy }

  vehicles-provider:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: data-providers/vehicles/Dockerfile
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["${VEHICLES_PROVIDER_PORT:-8011}:8011"]
    depends_on:
      redpanda: { condition: service_healthy }

  incidents-provider:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: data-providers/incidents/Dockerfile
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["${INCIDENTS_PROVIDER_PORT:-8012}:8012"]
    depends_on:
      redpanda: { condition: service_healthy }

  web:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: [api]

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  qdrant_data:
  redpanda_data:
  minio_data:
