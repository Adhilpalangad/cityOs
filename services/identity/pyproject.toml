[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cityos-identity"
version = "0.1.0"
description = "CityOS identity and RBAC service"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1,<24",
  "asyncpg>=0.31,<0.32",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<0.117",
  "httpx>=0.28,<0.29",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.10,<3",
  "redis>=6.4,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<0.36",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<0.22",
  "alembic>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern relies on calling Depends(...) (and
# friends) as an argument default; these are recognized as safe by design.
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header",
]
