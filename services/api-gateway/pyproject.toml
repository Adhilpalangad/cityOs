[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cityos-api-gateway"
version = "0.1.0"
description = "CityOS API gateway foundation"
requires-python = ">=3.12"
dependencies = [
  "aiokafka>=0.12,<0.13",
  "asyncpg>=0.31,<0.32",
  "fastapi>=0.116,<0.117",
  "httpx>=0.28,<0.29",
  "neo4j>=5.28,<6",
  "pydantic-settings>=2.10,<3",
  "qdrant-client>=1.15,<2",
  "redis>=6.4,<7",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<0.36",
  "websockets>=13,<18",
]

[project.optional-dependencies]
dev = [
  "alembic>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<0.13",
  "sqlalchemy[asyncio]>=2.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
